# knowledge/metrics.yaml
# Defined metrics for InsightAnalyst text-to-SQL planning.

metrics:
  revenue:
    name: "Revenue"
    description: "Total dollar value of sales generated from purchased items after applying discounts."
    synonyms:
      - "sales"
      - "total sales"
      - "turnover"
      - "dollar sales"
      - "top line"
    formula_sql: "SUM(od.UnitPrice * od.Quantity * (1 - od.Discount))"
    grain: "order line item ([Order Details])"
    caveats:
      - "Revenue is calculated from [Order Details], never from Orders.Freight."
      - "Freight is a shipping surcharge and must NEVER be included in revenue."
      - "Always bracket [Order Details] because the table name contains a space."
      - "Regional sales must join Orders -> Customers -> dim_country_region (never join EmployeeTerritories)."
    example_question: "Why did sales drop in the South region last month?"

  units_sold:
    name: "Units Sold"
    description: "Total volume or quantity of physical product units sold."
    synonyms:
      - "volume"
      - "quantity sold"
      - "item volume"
      - "total units"
    formula_sql: "SUM(od.Quantity)"
    grain: "order line item ([Order Details])"
    caveats:
      - "Represents physical unit volume, regardless of product unit price or discounts."
      - "Requires joining [Order Details] to Orders for date or regional filtering."
    example_question: "Which product category sold the most units in August 2023?"

  order_count:
    name: "Order Count"
    description: "Total number of completed distinct customer orders."
    synonyms:
      - "total orders"
      - "number of orders"
      - "order volume"
      - "transactions"
    formula_sql: "COUNT(DISTINCT o.OrderID)"
    grain: "order (Orders)"
    caveats:
      - "Must always use COUNT(DISTINCT o.OrderID) when joining with [Order Details] to prevent duplicate counts from line items."
    example_question: "How many orders were placed by European customers in September 2023?"

  average_order_value:
    name: "Average Order Value (AOV)"
    description: "Average revenue generated per distinct customer order."
    synonyms:
      - "AOV"
      - "average basket size"
      - "average order size"
      - "mean order revenue"
    formula_sql: "(SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)) * 1.0) / COUNT(DISTINCT o.OrderID)"
    grain: "order header aggregated across line items"
    caveats:
      - "Multiply numerator by 1.0 to avoid SQLite integer division truncation."
      - "Requires joining [Order Details] and Orders on OrderID."
    example_question: "What was our average order value in the North region last month?"
