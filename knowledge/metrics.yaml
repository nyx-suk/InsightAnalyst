# Metric Definitions for InsightAnalyst
# Grounded business definitions embedded into ChromaDB to ensure consistent calculations.

metrics:
  revenue:
    name: "Revenue"
    formula: "SUM(UnitPrice * Quantity * (1 - Discount))"
    source_table: "[Order Details]"
    grain: "order line item"
    caveats:
      - "Never include Freight in revenue calculation (Freight is a shipping cost)."
      - "Always bracket [Order Details] due to the space in table name."
      - "Join to Orders on OrderID to filter by OrderDate."
      - "To prevent row duplication when calculating regional revenue, join Orders to Customers and dim_country_region; never join EmployeeTerritories or Region."
    example_sql: |
      SELECT SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)) AS revenue
      FROM [Order Details] od
      JOIN Orders o ON od.OrderID = o.OrderID
      WHERE o.OrderDate >= '1997-01-01' AND o.OrderDate <= '1997-01-31';

  units_sold:
    name: "Units Sold"
    formula: "SUM(Quantity)"
    source_table: "[Order Details]"
    grain: "order line item"
    caveats:
      - "Reflects the total volume of product units sold, regardless of price or discount."
    example_sql: |
      SELECT SUM(od.Quantity) AS units_sold
      FROM [Order Details] od
      JOIN Orders o ON od.OrderID = o.OrderID
      WHERE o.OrderDate >= '1997-01-01' AND o.OrderDate <= '1997-01-31';

  order_count:
    name: "Order Count"
    formula: "COUNT(DISTINCT OrderID)"
    source_table: "Orders"
    grain: "order"
    caveats:
      - "Use COUNT(DISTINCT o.OrderID) when joining with [Order Details] to prevent duplicate counts from line items."
    example_sql: |
      SELECT COUNT(DISTINCT o.OrderID) AS order_count
      FROM Orders o
      WHERE o.OrderDate >= '1997-01-01' AND o.OrderDate <= '1997-01-31';

  average_order_value:
    name: "Average Order Value (AOV)"
    formula: "SUM(UnitPrice * Quantity * (1 - Discount)) / COUNT(DISTINCT OrderID)"
    source_table: "[Order Details] joined with Orders"
    grain: "order"
    caveats:
      - "Multiply by 1.0 to avoid integer division in SQLite."
    example_sql: |
      SELECT (SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)) * 1.0) / COUNT(DISTINCT o.OrderID) AS aov
      FROM [Order Details] od
      JOIN Orders o ON od.OrderID = o.OrderID
      WHERE o.OrderDate >= '1997-01-01' AND o.OrderDate <= '1997-01-31';
